# Development Application Configuration
application:
  name: DevOpsSimulator
  version: 1.0.0
  environment: development
  
server:
  host: localhost
  port: 3000
  ssl_enabled: false
  
logging:
  level: DEBUG
  format: text
  output: ./logs/dev.log
  
database:
  host: dev-db.local
  port: 5432
  name: devops_dev
  
features:
  auto_scaling: false
  load_balancer: disabled
  backup_enabled: false
# Development configuration changes